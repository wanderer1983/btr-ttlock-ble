name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the manifest version matches the tag
        run: |
          version=$(jq -r .version custom_components/btr_ttlock_ble/manifest.json)
          test "v$version" = "${{ github.event.release.tag_name }}" || test "$version" = "${{ github.event.release.tag_name }}"
      - name: Build btr_ttlock_ble.zip
        run: cd custom_components && zip -r ../btr_ttlock_ble.zip btr_ttlock_ble -x '*/__pycache__/*'
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" btr_ttlock_ble.zip --clobber
